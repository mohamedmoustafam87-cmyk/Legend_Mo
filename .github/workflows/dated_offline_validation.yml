name: Dated Operation Offline Validation
on:
  push:
    branches: [main]
    paths:
      - scheduled_delivery.py
      - scheduled_research.py
      - private_journal.py
      - tests/test_scheduled_delivery.py
      - .github/workflows/scanner_run.yml
      - .github/workflows/dated_offline_validation.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt 'cryptography>=43,<47'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Closed-gate validation with no source calls or messages
        run: python scheduled_delivery.py --dry-run
