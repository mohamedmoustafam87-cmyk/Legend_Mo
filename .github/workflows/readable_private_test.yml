name: Requested Readable Private Test
on:
  push:
    branches: [main]
    paths: [readable_private_test.enc.json]
permissions:
  contents: write
concurrency:
  group: legend-private-report-journal
  cancel-in-progress: false
jobs:
  requested-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Send explicitly requested readable test once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python readable_private_test.py
