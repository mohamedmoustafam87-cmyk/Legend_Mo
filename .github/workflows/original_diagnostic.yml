name: Original Operation Read-only Diagnosis
on:
  push:
    branches: [main]
    paths: [original_operation_diagnostic.py]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read failed job category without source requests or sends
        env:
          GH_TOKEN: ${{ github.token }}
        run: python original_operation_diagnostic.py
