name: Daily EGX Stock Scanner

on:
  schedule:
    - cron: '30 14 * * *'  # يعمل يومياً الساعة 2:30 ظهراً بتوقيت مصر
  workflow_dispatch:      # يتيح لك تشغيله يدوياً متى شئت بضغطة زر

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyTelegramBotAPI requests pandas pandas-ta numpy

      - name: Run Bot Scanner
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
