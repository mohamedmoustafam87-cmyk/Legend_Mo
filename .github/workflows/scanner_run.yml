name: EGX Bot Safe Delivery

on:
  schedule:
    - cron: '*/10 7-13 * * 0-4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Keep true until destination and sending are approved'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: egx-telegram-delivery
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline checks
        run: python -m unittest discover -s tests -v
      - name: Safe validation without messages
        if: vars.TELEGRAM_DELIVERY_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: python main.py --dry-run
      - name: Run approved Telegram delivery
        if: vars.TELEGRAM_DELIVERY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python main.py
