name: EGX Bot Run - Multi Schedule

on:
  schedule:

    # 10:30 صباحاً بتوقيت مصر
    # مصر حالياً UTC+3
    - cron: '30 7 * * 0-4'

    # 12:00 ظهراً بتوقيت مصر
    - cron: '0 9 * * 0-4'

    # 2:30 ظهراً بتوقيت مصر
    - cron: '30 11 * * 0-4'

  workflow_dispatch:


jobs:

  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI requests pandas numpy

      - name: Run Bot Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          python main.py
