name: EGX Bot Safe Delivery

on:
  schedule:
    - cron: '*/10 7-13 * * 0-4'
  push:
    branches: [main]
    paths: [scheduled_operation_activation.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validation only, no source calls or messages'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: legend-private-report-journal
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt 'cryptography>=43,<47'
      - name: Offline checks
        run: python -m unittest discover -s tests -v
      - name: Safe validation without source calls or messages
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python scheduled_delivery.py --dry-run
      - name: Run explicitly enabled dated private operation
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python scheduled_delivery.py
