name: EGX Bot Run - Multi Schedule

on:
  schedule:
    # 1. بداية الجلسة (10:30 صباحاً بتوقيت مصر = 8:30 UTC)
    - cron: '30 8 * * 0-4'
    # 2. منتصف الجلسة (12:00 ظهراً بتوقيت مصر = 10:00 UTC)
    - cron: '0 10 * * 0-4'
    # 3. نهاية الجلسة (2:30 ظهراً بتوقيت مصر = 12:30 UTC)
    - cron: '30 12 * * 0-4'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: Actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyTelegramBotAPI requests pandas numpy

      - name: Run Bot Scanner
        run: python main.py
