name: Original Report Operation
on:
  push:
    branches: [main]
    paths: [original_report_request.json]
  workflow_dispatch:
  # Schedule PAUSED Nov 25 pending the user's lateness-policy choice
  # (15-minute cap vs until-next-slot catchup). Re-add the trigger to resume:
  #  schedule:
  #    - cron: '0,10,20,30,40,50 10-15 * * 0-4'
  #      timezone: "Africa/Cairo"
permissions:
  contents: write
concurrency:
  group: legend-private-report-journal
  cancel-in-progress: false
jobs:
  original-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt 'cryptography>=43,<47'
      - name: Check original source syntax
        run: python -m py_compile app.py config.py scanner.py portfolio.py report.py strategy.py indicators.py original_report_delivery.py scheduled_delivery.py
      - name: Run non-sending delivery tests
        run: python -m unittest discover -s tests -v
      - name: Scheduled report delivery (Cairo slots, durable dedup)
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python scheduled_delivery.py
      - name: Send user-requested original report once
        if: github.event_name != 'schedule'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python original_report_delivery.py
