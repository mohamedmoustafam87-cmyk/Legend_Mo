name: EGX Bot Run - DST Safe Schedule

on:
  schedule:
    # الاستراتيجية: نشغل الـ workflow كل 10 دقايق خلال نطاق زمني واسع
    # يغطي كل مواعيد الإرسال الأربعة (10:30, 12:30, 2:30, 3:00 بتوقيت القاهرة)
    # في الحالتين الصيف (UTC+3) والشتاء (UTC+2)، والسكريبت (main.py) هو اللي
    # بيقرر فعليًا هل ده وقت إرسال ولا لأ عن طريق is_scheduled_report_time()
    #
    # نطاق UTC اللي بيغطي 10:30 - 15:00 بتوقيت القاهرة في الحالتين:
    #   صيف (UTC+3): 07:30 - 12:00 UTC
    #   شتاء (UTC+2): 08:30 - 13:00 UTC
    # فبناخد أوسع نطاق ممكن: 07:20 - 13:10 UTC كل 10 دقايق
    - cron: '*/10 7-13 * * 0-4'

  workflow_dispatch:


jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI requests pandas numpy

      - name: Run Bot Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          python main.py
