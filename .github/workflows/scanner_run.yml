name: Original Report Operation
on:
  push:
    branches: [main]
    paths: [original_report_request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legend-private-report-journal
  cancel-in-progress: false
jobs:
  original-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt 'cryptography>=43,<47'
      - name: Check original source syntax
        run: python -m py_compile app.py config.py scanner.py portfolio.py report.py strategy.py indicators.py original_report_delivery.py
      - name: Send user-requested original report once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python original_report_delivery.py
