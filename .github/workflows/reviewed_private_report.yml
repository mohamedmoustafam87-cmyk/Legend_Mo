name: Reviewed Private Report Delivery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legend-private-report-journal
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Validate destination and deliver reviewed batch without retries
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python scoped_private_delivery.py
