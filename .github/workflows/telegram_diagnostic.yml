name: Telegram Connection Diagnostic - No Messages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-no-send-diagnostic
  cancel-in-progress: false

jobs:
  diagnose-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare public Telegram transport without credentials
        shell: bash
        run: |
          set +e
          for family in 4 6; do
            echo "Public Telegram IPv${family} transport (no bot token)"
            curl "-${family}" --silent --output /dev/null \
              --connect-timeout 10 --max-time 15 \
              --write-out 'http=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
              https://api.telegram.org/
            result=$?
            echo "curl_exit=${result}"
          done
          exit 0
      - name: Check connection and private destination without sending
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        shell: python
        run: |
          import json
          import os
          import re
          import socket
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          
          token = os.environ.get('TELEGRAM_TOKEN', '').strip()
          destination = os.environ.get('ADMIN_CHAT_ID', '').strip()
          if not token or not destination.isdecimal():
              print('CONFIG: missing token or non-private numeric destination. No message sent.')
              sys.exit(1)
          print('Token format matches expected pattern:', bool(re.fullmatch(r'\d{8,12}:[A-Za-z0-9_-]{30,50}', token)))
          if any(c.isspace() for c in token) or any(c in token for c in ('"', '\\')):
              print('CONFIG: token contains unsafe whitespace or quoting. No message sent.')
              sys.exit(1)
          original_getaddrinfo = socket.getaddrinfo
          def ipv4_getaddrinfo(host, port, family=0, type=0, proto=0, flags=0):
              return original_getaddrinfo(host, port, socket.AF_INET, type, proto, flags)
          socket.getaddrinfo = ipv4_getaddrinfo
          
          def probe(label, credential, verb, transport, method='getMe', values=None):
              if method not in ('getMe', 'getChat'):
                  raise RuntimeError('Read-only methods only')
              values = values or {}
              url = 'https://api.telegram.org/bot' + credential + '/' + method
              encoded = urllib.parse.urlencode(values)
              if verb == 'GET' and encoded:
                  url += '?' + encoded
              started = time.monotonic()
              result = None
              category = 'UNEXPECTED_ERROR'
              try:
                  if transport == 'python':
                      request = urllib.request.Request(url, data=encoded.encode() if verb == 'POST' else None, method=verb)
                      try:
                          with urllib.request.urlopen(request, timeout=8) as response:
                              raw = response.read(65536)
                              status = response.status
                      except urllib.error.HTTPError as error:
                          raw = error.read(65536)
                          status = error.code
                  else:
                      # Token-bearing URL travels only through private stdin, never argv or logs.
                      config = 'url = "' + url + '"\n'
                      args = ['curl', '-4', '--silent', '--connect-timeout', '5', '--max-time', '8', '--max-filesize', '65536', '--config', '-', '--write-out', '\n%{http_code}', '--request', verb]
                      if verb == 'POST':
                          args += ['--data', encoded]
                      completed = subprocess.run(args, input=config.encode(), stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=10)
                      if completed.returncode:
                          category = 'CURL_EXIT_' + str(completed.returncode)
                          print(label + ': ' + category + ' elapsed=' + str(round(time.monotonic() - started, 2)))
                          return None
                      raw, status_bytes = completed.stdout.rsplit(b'\n', 1)
                      status = int(status_bytes)
                  category = 'HTTP_' + str(status)
                  try:
                      parsed = json.loads(raw)
                      if isinstance(parsed, dict) and parsed.get('ok') is True:
                          result = parsed.get('result')
                          category += '_API_OK'
                      elif isinstance(parsed, dict) and type(parsed.get('error_code')) is int:
                          category += '_API_' + str(parsed['error_code'])
                  except (ValueError, UnicodeError):
                      category += '_NON_JSON'
              except Exception as error:
                  category = type(error).__name__
              print(label + ': ' + category + ' elapsed=' + str(round(time.monotonic() - started, 2)))
              return result
          
          # Invalid dummy credential tests API routing without using a real bot.
          probe('Dummy Python GET', '0:invalid', 'GET', 'python')
          probe('Dummy Python POST', '0:invalid', 'POST', 'python')
          probe('Dummy curl GET', '0:invalid', 'GET', 'curl')
          working = None
          for transport in ('python', 'curl'):
              for verb in ('GET', 'POST'):
                  identity = probe('Configured ' + transport + ' ' + verb, token, verb, transport)
                  if isinstance(identity, dict) and identity.get('is_bot') is True and working is None:
                      working = (transport, verb)
          if working:
              transport, verb = working
              chat = probe('Private destination ' + transport + ' ' + verb, token, verb, transport, 'getChat', {'chat_id': destination})
              if isinstance(chat, dict) and chat.get('type') == 'private' and str(chat.get('id')) == destination:
                  print('AUTH_AND_PRIVATE_DESTINATION_CONFIRMED. No send method called.')
                  sys.exit(0)
          print('Diagnostic incomplete. No send method called. No message sent.')
          sys.exit(1)
